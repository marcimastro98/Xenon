<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Theme, before the first paint: a deferred script would flash the other
     ground first. /theme.js only builds the control. -->
<script>try{var m=localStorage.getItem('xenon.site.theme');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m);}catch(e){}</script>
<script src="/theme.js" defer></script>
<meta name="theme-color" content="#F7F8F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090B0D" media="(prefers-color-scheme: dark)">
<title>Xenon — community catalog</title>
<meta name="robots" content="noindex">
<!--
  The community gallery moved to /catalog/ — this folder now only holds the data
  it renders (catalog.json, codes/). Per-item links like /community/#demonic were
  shared on Discord long before the move and kept 404ing, so this stub forwards
  them, hash intact, to the same entry in the new catalog.

  The hash never reaches the server, so the redirect has to happen here in JS;
  <meta http-equiv="refresh"> would drop it. replace() keeps the dead URL out of
  the history, so Back goes where the visitor came from, not into a redirect loop.
-->
<link rel="canonical" href="https://xenon-app.com/catalog/">
<script>
  (function () {
    var hash = location.hash || '';
    // Only a catalog id may ride along — same shape the catalog validates ids
    // against. Anything else (an injected URL, markup) is dropped, not forwarded.
    if (!/^#[a-z0-9][a-z0-9_-]{0,60}$/.test(hash)) hash = '';
    location.replace('../catalog/' + hash);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--g-0); color: var(--bone-1); font: 15px/1.6 system-ui, sans-serif; }
  a { color: var(--bone-0); }
</style>
<!-- PANEL token layer. Linked AFTER the inline <style> above on purpose:
     this file owns the palette, the type and the motion for every page on the
     site, and each page kept its own drifted copy of those tokens. Later wins,
     so one file re-skins all nine. Page-specific rules above are untouched. -->
<link rel="stylesheet" href="/site.css">
</head>
<body>
  <p>The community catalog moved — <a href="../catalog/">continue to xenon-app.com/catalog/</a>.</p>
</body>
</html>
