name: Build Xenon Helper

# MANUAL RECOVERY TOOL. Normal releases build the helper inside release.yml
# (the atomic pipeline triggered by pushing the version tag), which stages
# every asset on a draft release BEFORE it is published — the old
# `release: published` trigger here raced the publish and left a window where
# the release was live without xenon-helper.exe.
#
# Run this manually to rebuild the helper for an EXISTING release (pass the
# tag) or just to get the exe as a workflow artifact (leave the tag empty).
#
# KEEP IN SYNC with the `helper` job in release.yml (same build steps,
# duplicated on purpose so the recovery tool doesn't depend on the pipeline).
#
# Building in CI rather than on a dev machine gives the exe verifiable
# provenance: the binary users download is reproducibly built from the
# tagged public source by GitHub's infrastructure.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the exe to (empty = artifact only)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-helper-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish helper
        run: dotnet publish helper -c Release -o out

      - name: Sign the helper when a certificate is configured
        shell: pwsh
        env:
          IN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
        run: |
          # Opt-in on one secret, and unset is this repo's state until the
          # certificate lands: no secret means the step says so and exits 0,
          # leaving the exe exactly as it shipped before.
          #
          # The test lives in the shell because the `secrets` context is not
          # available to step `if:` conditionals - the same constraint the
          # macOS job works around.
          if ([string]::IsNullOrWhiteSpace($env:IN_THUMBPRINT)) {
            Write-Host 'no code-signing certificate configured - shipping xenon-helper.exe unsigned'
            exit 0
          }
          $env:XENON_SIGN_THUMBPRINT = $env:IN_THUMBPRINT
          & "$env:GITHUB_WORKSPACE/tools/sign-windows.ps1" -Path 'out/xenon-helper.exe'

      - name: Attach exe to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" out/xenon-helper.exe --clobber

      - name: Upload as workflow artifact
        if: inputs.tag == ''
        uses: actions/upload-artifact@v5
        with:
          name: xenon-helper
          path: out/xenon-helper.exe
