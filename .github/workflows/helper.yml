name: Build Xenon Helper

# MANUAL RECOVERY TOOL. Normal releases build the helper inside release.yml
# (the atomic pipeline triggered by pushing the version tag), which stages
# every asset on a draft release BEFORE it is published — the old
# `release: published` trigger here raced the publish and left a window where
# the release was live without xenon-helper.exe.
#
# Run this manually to rebuild the helper for an EXISTING release (pass the
# tag) or just to get the exe as a workflow artifact (leave the tag empty).
#
# KEEP IN SYNC with the `helper` job in release.yml (same build steps,
# duplicated on purpose so the recovery tool doesn't depend on the pipeline).
#
# Building in CI rather than on a dev machine gives the exe verifiable
# provenance: the binary users download is reproducibly built from the
# tagged public source by GitHub's infrastructure.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the exe to (empty = artifact only)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-helper-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The signing machine, not a hosted runner. The certificate lives behind
    # the SimplySign virtual card, in the interactive session of the user who
    # logged in, and cannot be handed to GitHub as a secret - so the Windows
    # half of a release is built where the card is. The runner is started by
    # hand (run.cmd) in that session, never installed as a service: a service
    # runs in session 0 and sees no card. To release unsigned from a hosted
    # runner instead, put windows-latest back here AND unset
    # WINDOWS_SIGN_THUMBPRINT, or the certificate check below fails on purpose.
    runs-on: [self-hosted, windows, xenon-signing]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # DOTNET_INSTALL_DIR: on the self-hosted signing machine the default
      # (C:\Program Files\dotnet) is not writable without elevation and the
      # step fails; the runner's tool cache is, and persists between jobs so
      # the SDK is fetched once. Hosted runners ignore the difference.
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: '10.0.x'

      - name: Publish helper
        run: dotnet publish helper -c Release -o out

      - name: Sign the helper when a certificate is configured
        shell: pwsh
        env:
          IN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
        run: |
          # Opt-in on one secret: unset means the step says so and exits 0,
          # leaving the exe exactly as it shipped before. Set, the certificate
          # must actually be in this runner's store - see the native job for
          # why that is asserted rather than assumed.
          #
          # The test lives in the shell because the `secrets` context is not
          # available to step `if:` conditionals - the same constraint the
          # macOS job works around.
          if ([string]::IsNullOrWhiteSpace($env:IN_THUMBPRINT)) {
            Write-Host 'no code-signing certificate configured - shipping xenon-helper.exe unsigned'
            exit 0
          }
          $thumb = ($env:IN_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          $cert = Get-ChildItem "Cert:\CurrentUser\My\$thumb" -ErrorAction SilentlyContinue
          if (-not $cert -or -not $cert.HasPrivateKey) {
            throw "WINDOWS_SIGN_THUMBPRINT is set but certificate $thumb is not usable in Cert:\CurrentUser\My on this runner. This job has to run on the signing machine, with SimplySign Desktop logged in."
          }
          $env:XENON_SIGN_THUMBPRINT = $thumb
          & "$env:GITHUB_WORKSPACE/tools/sign-windows.ps1" -Path 'out/xenon-helper.exe'

      - name: Attach exe to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" out/xenon-helper.exe --clobber

      - name: Upload as workflow artifact
        if: inputs.tag == ''
        uses: actions/upload-artifact@v5
        with:
          name: xenon-helper
          path: out/xenon-helper.exe
