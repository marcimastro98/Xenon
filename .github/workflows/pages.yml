name: Deploy website to Pages

# Serves docs/ (the static marketing/website folder) via GitHub Pages.
#
# Why this exists instead of the built-in "Deploy from a branch" build:
# that legacy path has no concurrency control, so two pushes landing close
# together (a manual push + the supporters bot, or several commits in a row)
# spawn two Pages deployments that race — GitHub allows only one active, so the
# loser fails with "Deployment failed, try again later." The `concurrency` group
# below queues deployments instead, which removes the race. A manual re-run
# always worked precisely because it ran alone.
#
# Requires: Repo → Settings → Pages → Build and deployment → Source = GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # docs/demo/ is generated from these at deploy time, so a change here has
      # to redeploy the site or /demo goes stale against the app. This list IS
      # the copy allowlist in tools/build-demo.mjs — server/test/demo-build.test.mjs
      # pins the two together so they cannot drift apart.
      - 'server/index.html'
      - 'server/js/**'
      - 'server/components/**'
      - 'server/styles/**'
      - 'server/public/**'
      - 'server/assets/**'
      - 'server/vendor/**'
      - 'packages/core/src/**'
      - 'tools/build-demo.mjs'
      - 'tools/demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments so concurrent pushes queue instead of racing.
# cancel-in-progress: false → never abandon an in-flight deploy; the next one
# waits its turn (a superseded-but-cancelled deploy would look like a failure).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: build-seo.mjs reads each page's last commit date for the
          # sitemap's <lastmod>. A shallow clone has no such date, and the script
          # then ships the entry without one rather than inventing today's.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Generates docs/demo/ from server/ + packages/core/src. Deliberately no
      # `npm ci`: build-demo.mjs uses only node: builtins, and package.json
      # declares "os": ["win32"] so an install here would be wrong anyway. The
      # script reads packages/core/src directly rather than server/shared, which
      # is a junction on Windows and a symlink elsewhere and would copy as a
      # dangling link.
      - name: Build the browser demo
        run: node tools/build-demo.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Regenerates sitemap.xml, the per-entry pages under /catalog/, and the
      # catalog's link index + ItemList from catalog.json. Running it here means a
      # bot commit that only touches the catalog still republishes with the
      # crawlable surface in step — the committed output is the same, so this is
      # a safety net, not the only path.
      - name: Build SEO surface
        run: node tools/build-seo.mjs

      - name: Upload docs/ artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Creates the deployment the same way actions/deploy-pages does — same POST,
      # same OIDC token, same artifact — and then does NOT wait for it. That one
      # difference is the whole point.
      #
      # deploy-pages polls for at most 10 minutes and then CANCELS the deployment,
      # and a cancelled one stays failed forever: a deployment's ID *is* the commit
      # SHA, so no re-run can revive it and only a fresh commit can publish again.
      # The wait cannot be extended either — `MAX_TIMEOUT = 600000` is hardcoded in
      # the action (src/internal/deployment.js takes Math.min of the input and it),
      # so a bigger `timeout:` is clamped back with a warning and nothing else.
      #
      # On 2026-08-06 Pages published this site in 35s the evening before, 9m24s at
      # 11:50, and then needed more than 10 minutes for the whole afternoon with no
      # incident reported by GitHub. Three commits in a row were stranded that way,
      # each one a green build whose finished artifact was thrown away by our own
      # side. Nothing here was broken; the client-side deadline was the fault.
      #
      # We keep `id: deployment` because the job's environment url reads
      # steps.deployment.outputs.page_url, and page_url comes back in this POST.
      - name: Create the Pages deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          # Read with :- so a missing grant reports itself instead of dying on
          # `set -u` before the message below can explain what is wrong.
          req_url="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          req_tok="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          if [ -z "$req_url" ] || [ -z "$req_tok" ]; then
            echo '::error::No OIDC request env. Is `id-token: write` still in this workflow permissions block?'
            exit 1
          fi
          # No audience argument, to match the action's own core.getIDToken().
          oidc=$(curl -sf -H "Authorization: bearer $req_tok" "$req_url" | jq -r '.value')
          if [ -z "$oidc" ] || [ "$oidc" = null ]; then
            echo '::error::The OIDC endpoint answered without a token.'
            exit 1
          fi
          # -F types artifact_id as a number; -f would send it as a string and the
          # API rejects that.
          resp=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" \
                   -F artifact_id="$ARTIFACT_ID" \
                   -f pages_build_version="$GITHUB_SHA" \
                   -f oidc_token="$oidc")
          echo "page_url=$(jq -r '.page_url // ""' <<<"$resp")" >> "$GITHUB_OUTPUT"
          echo "Created. GitHub will finish it in its own time: $(jq -r '.status_url // "no status_url"' <<<"$resp")"

      # Reporting only, and deliberately unable to do harm: it never cancels, and
      # it never fails the run. If Pages is having a slow day the deployment stays
      # alive and completes after this step has stopped watching — the only thing
      # lost is the IndexNow ping below, which is gated on having seen it go live.
      - name: Wait for Pages to publish
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          s=''
          for i in $(seq 1 150); do            # 150 × 10s = 25 minutes
            s=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA" -q '.status' 2>/dev/null || echo '')
            case "$s" in
              # 'succeed' is the exact string the Pages API reports, not 'success'.
              succeed)
                echo "live=true" >> "$GITHUB_OUTPUT"
                echo "Published after about $((i * 10))s."
                exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::warning::Pages reported '$s'. The site was not updated."
                exit 0 ;;
            esac
            sleep 10
          done
          echo "::warning::Still '$s' after 25 minutes. The deployment is alive and will finish on its own; IndexNow was not pinged."

      # Announces the URLs this run changed to the IndexNow engines (Bing, and
      # through it Copilot; Yandex, Seznam, Naver). It runs AFTER the deploy on
      # purpose: the ping invites an immediate crawl, so the page has to be live
      # before it goes out.
      #
      # `continue-on-error` plus the script's own exit-0 discipline: a search
      # engine that is down must never turn a successful website deploy into a
      # red run.
      #
      # The commit range is what the push actually moved; the script also reads
      # the working tree, which is what catches a catalog page that build-seo
      # regenerated from a bot's catalog.json edit without any commit naming it.
      #
      # The `if` is what keeps "after the deploy" true now that the step above
      # reports instead of blocking: inviting a crawl of a page that is still
      # publishing would send every engine at the OLD copy.
      - name: Ping IndexNow
        if: steps.live.outputs.live == 'true'
        continue-on-error: true
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_AFTER: ${{ github.sha }}
        run: node tools/indexnow.mjs
