name: Deploy website to Pages

# Serves docs/ (the static marketing/website folder) via GitHub Pages.
#
# Why this exists instead of the built-in "Deploy from a branch" build:
# that legacy path has no concurrency control, so two pushes landing close
# together (a manual push + the supporters bot, or several commits in a row)
# spawn two Pages deployments that race — GitHub allows only one active, so the
# loser fails with "Deployment failed, try again later." The `concurrency` group
# below queues deployments instead, which removes the race. A manual re-run
# always worked precisely because it ran alone.
#
# Requires: Repo → Settings → Pages → Build and deployment → Source = GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # docs/demo/ is generated from these at deploy time, so a change here has
      # to redeploy the site or /demo goes stale against the app. This list IS
      # the copy allowlist in tools/build-demo.mjs — server/test/demo-build.test.mjs
      # pins the two together so they cannot drift apart.
      - 'server/index.html'
      - 'server/js/**'
      - 'server/components/**'
      - 'server/styles/**'
      - 'server/public/**'
      - 'server/assets/**'
      - 'server/vendor/**'
      - 'packages/core/src/**'
      - 'tools/build-demo.mjs'
      - 'tools/demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments so concurrent pushes queue instead of racing.
# cancel-in-progress: false → never abandon an in-flight deploy; the next one
# waits its turn (a superseded-but-cancelled deploy would look like a failure).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: build-seo.mjs reads each page's last commit date for the
          # sitemap's <lastmod>. A shallow clone has no such date, and the script
          # then ships the entry without one rather than inventing today's.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Generates docs/demo/ from server/ + packages/core/src. Deliberately no
      # `npm ci`: build-demo.mjs uses only node: builtins, and package.json
      # declares "os": ["win32"] so an install here would be wrong anyway. The
      # script reads packages/core/src directly rather than server/shared, which
      # is a junction on Windows and a symlink elsewhere and would copy as a
      # dangling link.
      - name: Build the browser demo
        run: node tools/build-demo.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Regenerates sitemap.xml, the per-entry pages under /catalog/, and the
      # catalog's link index + ItemList from catalog.json. Running it here means a
      # bot commit that only touches the catalog still republishes with the
      # crawlable surface in step — the committed output is the same, so this is
      # a safety net, not the only path.
      - name: Build SEO surface
        run: node tools/build-seo.mjs

      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # This step builds and uploads nothing: it polls GitHub every 5s asking
      # whether the site is live, and when it gives up it CANCELS the deployment.
      # That cancel is the expensive half — a deployment's ID *is* the commit SHA,
      # and a cancelled one stays failed, so no re-run can revive it and only a
      # fresh commit can deploy again.
      #
      # Do NOT try to raise the wait with `timeout:`. It is capped in the action
      # itself (`MAX_TIMEOUT = 600000` in src/internal/deployment.js,
      # `Math.min(timeoutInput, MAX_TIMEOUT)`), so a larger value is silently
      # clamped back to 10 minutes with only a warning in the log. Tried on
      # 2026-08-06 and it changed nothing.
      #
      # So when Pages itself needs more than 10 minutes, this step cannot succeed.
      # Measured that day as Pages degraded: 35s the evening before, 5m50s at
      # 08:49, 9m24s at 11:50 (success, 36s of margin), then >10min all afternoon
      # and every deploy failed. Nothing was wrong here and GitHub reported no
      # incident; the only fixes are to wait it out, or to stop waiting at all by
      # creating the deployment through the Pages API and not polling for it.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Announces the URLs this run changed to the IndexNow engines (Bing, and
      # through it Copilot; Yandex, Seznam, Naver). It runs AFTER the deploy on
      # purpose: the ping invites an immediate crawl, so the page has to be live
      # before it goes out.
      #
      # `continue-on-error` plus the script's own exit-0 discipline: a search
      # engine that is down must never turn a successful website deploy into a
      # red run.
      #
      # The commit range is what the push actually moved; the script also reads
      # the working tree, which is what catches a catalog page that build-seo
      # regenerated from a bot's catalog.json edit without any commit naming it.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_AFTER: ${{ github.sha }}
        run: node tools/indexnow.mjs
