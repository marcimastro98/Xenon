name: Deploy website

# Builds docs/ (the website) and publishes it on Cloudflare (site-host/), which serves
# xenon-app.com since 10 Nov 2026. GitHub Pages took from 35 s to over 25 minutes to publish,
# with no incident reported; Cloudflare is live in seconds, so a green run means the site is
# online. The file keeps its old name so links to its runs and badges stay valid.
#
# The `concurrency` group queues runs: two pushes close together (a manual push and the
# supporters bot) publish one after the other, never at once.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # docs/demo/ is generated from these at deploy time, so a change here has
      # to redeploy the site or /demo goes stale against the app. This list IS
      # the copy allowlist in tools/build-demo.mjs — server/test/demo-build.test.mjs
      # pins the two together so they cannot drift apart.
      - 'server/index.html'
      - 'server/js/**'
      - 'server/components/**'
      - 'server/styles/**'
      - 'server/public/**'
      - 'server/assets/**'
      - 'server/vendor/**'
      - 'packages/core/src/**'
      - 'tools/build-demo.mjs'
      - 'tools/build-i18n.mjs'
      - 'tools/build-page-langs.mjs'
      - 'tools/page-i18n.mjs'
      - 'tools/lang-pages.mjs'
      - 'tools/site-chrome.mjs'
      # Imported by the builders: build-i18n -> home-bake, build-seo ->
      # page-meta -> home-i18n, build-seo -> trial-covers. Pinned by
      # server/test/site-deploy-inputs.test.mjs.
      - 'tools/home-bake.mjs'
      - 'tools/home-i18n.mjs'
      - 'tools/page-meta.mjs'
      - 'tools/trial-covers.mjs'
      - 'tools/build-seo.mjs'
      - 'tools/stamp-release.mjs'
      - 'tools/build-releases.mjs'
      # docs/releases.html is written from the changelog at deploy time.
      - 'CHANGELOG.md'
      - 'tools/i18n/**'
      - 'tools/demo/**'
      - '.github/workflows/pages.yml'
      # The Cloudflare host of the same build (worker + its config).
      - 'site-host/**'
  workflow_dispatch: {}
  # A new Xenon Maker release (its own private repo) asks for a redeploy.
  repository_dispatch:
    types: [maker-release]
  # Once a day, so the release facts the pages state (version, installer size)
  # follow a release published between two pushes. Never `release: published`:
  # the release pipeline stages assets on a draft and publishes by hand.
  schedule:
    - cron: '41 7 * * *'

permissions:
  contents: read

# Serialize deployments so concurrent pushes queue instead of racing.
# cancel-in-progress: false → never abandon an in-flight deploy; the next one
# waits its turn (a superseded-but-cancelled deploy would look like a failure).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://xenon-app.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # no token left in .git/config for later steps
          # Full history: build-seo.mjs reads each page's last commit date for the
          # sitemap's <lastmod>. A shallow clone has no such date, and the script
          # then ships the entry without one rather than inventing today's.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Generates docs/demo/ from server/ + packages/core/src. Deliberately no
      # `npm ci`: build-demo.mjs uses only node: builtins, and package.json
      # declares "os": ["win32"] so an install here would be wrong anyway. The
      # script reads packages/core/src directly rather than server/shared, which
      # is a junction on Windows and a symlink elsewhere and would copy as a
      # dangling link.
      - name: Build the browser demo
        run: node tools/build-demo.mjs

      # xenon-app.com/maker/ is built in the private xenon-maker repo and
      # published there as maker.zip on each release. MAKER_RELEASE_TOKEN is a
      # read-only fine-grained token on that repo. Without it the site deploys
      # as before, with a warning; with it, a failed download fails the deploy
      # rather than shipping a site whose /maker/ links lead nowhere.
      - name: Add Xenon Maker
        env:
          GH_TOKEN: ${{ secrets.MAKER_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::MAKER_RELEASE_TOKEN is not set: /maker/ is not published"
            exit 0
          fi
          gh release download --repo marcimastro98/xenon-maker --pattern maker.zip --dir "$RUNNER_TEMP/maker"
          mkdir -p docs/maker
          unzip -q "$RUNNER_TEMP/maker/maker.zip" -d docs/maker
          test -f docs/maker/index.html

      # Regenerates sitemap.xml, the per-entry pages under /catalog/, and the
      # catalog's link index + ItemList from catalog.json. Running it here means a
      # bot commit that only touches the catalog still republishes with the
      # crawlable surface in step — the committed output is the same, so this is
      # a safety net, not the only path.
      # One copy of the home page per language, with the strings baked in so a
      # crawler indexes Spanish at /es/ instead of the English it renders
      # everywhere with an English browser. Must run before build-seo.mjs,
      # which lists the copies in the sitemap.
      - name: Stamp the latest release into the pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/stamp-release.mjs

      # What changed in each version, from CHANGELOG.md, so the site answers
      # "is this still maintained?" without sending the visitor to GitHub.
      - name: Build the releases page
        run: node tools/build-releases.mjs

      - name: Build language copies of the home page
        run: node tools/build-i18n.mjs

      # The other pages' copies (download, FAQ, the guides...), from the
      # dictionaries in tools/i18n/. A missing translation keeps English and is
      # reported in the log; it never stops a deploy.
      - name: Build language copies of the other pages
        run: node tools/build-page-langs.mjs

      - name: Build SEO surface
        run: node tools/build-seo.mjs

      # The site's host. Without the token nothing can publish, so the run fails and says why.
      - name: Publish on Cloudflare
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: the site was not published"
            exit 1
          fi
          # The time of the commit this build came from: the hub's live copy of /community/
          # (site-host/worker.js) is served only while it is newer than this.
          npx --yes wrangler@4.110.0 deploy --config site-host/wrangler.jsonc --var "SITE_COMMIT_TIME:$(git log -1 --format=%ct)"
          echo "Live: https://xenon-app.com" >> "$GITHUB_STEP_SUMMARY"

      # Announces the URLs this run changed to the IndexNow engines (Bing, and
      # through it Copilot; Yandex, Seznam, Naver). It runs AFTER the deploy on
      # purpose: the ping invites an immediate crawl, so the page has to be live
      # before it goes out.
      #
      # `continue-on-error` plus the script's own exit-0 discipline: a search
      # engine that is down must never turn a successful website deploy into a
      # red run.
      #
      # The commit range is what the push actually moved; the script also reads
      # the working tree, which is what catches a catalog page that build-seo
      # regenerated from a bot's catalog.json edit without any commit naming it.
      #
      # The `if`: a crawl invited before the new copy is live would read the old one.
      - name: Ping IndexNow
        if: steps.cloudflare.outcome == 'success'
        continue-on-error: true
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_AFTER: ${{ github.sha }}
        run: node tools/indexnow.mjs
