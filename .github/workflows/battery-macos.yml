name: Dongle battery (macOS) check

# hid-darwin.js calls IOKit through koffi, and darwin.js runs ioreg and system_profiler, which
# nothing on Windows or Linux can run. This runs them on a real Mac and fails loudly. There is no
# dongle or Bluetooth device on the runner: it proves the calls load, list and survive a read,
# not that any device answers.
#
# It NEVER touches a release: read-only permissions, uploads nothing.
on:
  push:
    branches: ['ci-test/**']
    paths:
      - 'server/hid/**'
      - 'server/device-battery/**'
      - '.github/workflows/battery-macos.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no token left in .git/config for later steps

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - run: npm ci

      - name: Reader tests
        run: node --test --test-timeout=60000 server/test/device-battery-macos.test.mjs server/test/device-battery-reader.test.mjs server/test/device-battery-apple.test.mjs
