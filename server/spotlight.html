<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xenon Search</title>
<!-- Spotlight popup (main PC): the local file search as its own window, opened
     by the global hotkey (helper hotkey-serve → server spawns Edge app-mode)
     or on demand. Same loopback server, same trust boundary; closing the
     Spotlight closes the window. The dashboard theme is read from /settings on
     every show, so the bar matches the user's look. Bit's chat opens in the same
     window, with the dashboard's panel (js/spotlight-chat.js). -->
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/global.css">
<link rel="stylesheet" href="styles/themes-light.css">
<link rel="stylesheet" href="styles/themes-light-widgets.css">
<link rel="stylesheet" href="styles/themes-light-text-and-tiles.css">
<link rel="stylesheet" href="styles/theme-contract.css">
<link rel="stylesheet" href="styles/theme-contract-states-and-chat.css">
<link rel="stylesheet" href="styles/themes-retro.css">
<link rel="stylesheet" href="styles/themes-comic.css">
<link rel="stylesheet" href="styles/themes-comic-text.css">
<link rel="stylesheet" href="styles/themes-comic-controls.css">
<link rel="stylesheet" href="styles/themes-comic-deck.css">
<link rel="stylesheet" href="styles/themes-comic-chrome.css">
<link rel="stylesheet" href="components/Spotlight/Spotlight.css">
<link rel="stylesheet" href="components/Spotlight/SpotlightResults.css">
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  /* The window IS the spotlight: theme background, pill centered, no
     backdrop-filter (there is nothing behind to frost). */
  body.spotlight-popup .spotlight {
    background: var(--bg, #0b0d11);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  /* Pill pinned near the top so a compact (resized) window is JUST the pill,
     PowerToys-Run-style; results fill the grown window below it. */
  body.spotlight-popup .spot-shell { margin-top: 22px; }
  body.spotlight-popup .spot-expanded .spot-shell { margin-top: 22px; }
  body.spotlight-popup .spot-list { max-height: calc(100vh - 130px); }
  body.spotlight-popup .spotlight::before { display: none; }
  /* Native frameless window (?frameless=1): the window IS the pill,
     PowerToys-Run-style — sized exactly to the bar by the shell, filled
     edge-to-edge with the OPAQUE theme surface (Windows rounds the corners
     of undecorated windows on its own). Deliberately no transparency and no
     backdrop-filter: on hybrid-GPU machines the kiosk pins WebView2 to the
     iGPU while this window sits on the dGPU's monitor, and a transparent
     webview composed across adapters renders NOTHING (proven live). */
  html.spotlight-frameless-host,
  html.spotlight-frameless-host body { background: rgb(var(--panel-rgb)); }
  body.spotlight-frameless .spotlight { background: transparent; }
  body.spotlight-frameless .spot-shell {
    margin: 0;
    width: 100%;
    max-width: none;
    height: 100vh;
    border-radius: 0;
    border: none;
    box-shadow: none;
    background: rgb(var(--panel-rgb));
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  body.spotlight-frameless .spot-shell {
    /* Hairline inside the window edge: gives the slab definition against any
       wallpaper without fighting the DWM corner rounding. */
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09);
  }
  :root[data-appearance="light"] body.spotlight-frameless .spot-shell {
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
  }
  body.spotlight-frameless .spot-bar { min-height: 62px; padding: 0 20px; }
  body.spotlight-frameless .spot-body { flex: 1; min-height: 0; padding: 0 8px 8px 12px; }
  body.spotlight-frameless .spot-expanded .spot-shell { margin: 0; width: 100%; }
  body.spotlight-frameless .spot-list { max-height: none; flex: 1; min-height: 0; }
  /* Bit's chat in this window: the dashboard's panel, filling it with the theme
     surface. AIPanel.css draws it dark for the dashboard's overlay. */
  body.spot-chat .spotlight { display: none; }
  body.spot-chat .ai-overlay { position: fixed; inset: 0; padding: 0; background: rgb(var(--panel-rgb)); }
  body.spot-chat .ai-panel {
    width: 100%;
    max-width: none;
    height: 100%;
    max-height: none;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: rgb(var(--panel-rgb));
    animation: none;
  }
  body.spot-chat .ai-panel::before { display: none; }
  body.spot-chat .ai-header-title { color: var(--text); }
  body.spot-chat :is(.ai-clear-btn, .ai-header-close) { color: var(--muted-text); background: transparent; }
  body.spot-chat :is(.ai-clear-btn, .ai-header-close):hover { color: var(--text); background: var(--hover-bg); }
</style>
</head>
