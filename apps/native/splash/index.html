<!DOCTYPE html>
<!--
  Xenon native kiosk — startup splash.

  This is the ONLY page bundled into the native app. It is not a copy of the
  dashboard: it just waits for the local backend service to answer on
  127.0.0.1:3030, then navigates the same webview to the real dashboard so the
  native window renders the exact same UI as the browser and the iCUE iframe.

  Readiness probe: a no-cors fetch to /ping. It resolves as soon as the server
  responds (even with a 403 from the loopback Origin guard — we only need "did it
  answer"), and rejects with a network error while the service is still starting.
  Once the dashboard is loaded, ITS own offline handling covers transient drops.

  It is also the first-run installer: when nothing ever answers, this page offers
  to install the missing backend (see the setup handover in the script) — the
  user-driven replacement for the setup.exe's old silent post-install spawn.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenon</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    /* The dashboard's own boot ground (BootSplash.css), so the hand-over to it
       does not flash. */
    background: #06080a; color: #ededed;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  /* Bit sits where the dashboard's splash draws it (the middle of the window),
     and the words hang below. The two 1fr rows keep Bit centred; when the text
     needs more room than half the window, the top row gives it up first, and
     past that the page scrolls from the top, so nothing is ever cut off. */
  .wrap {
    height: 100%; overflow-y: auto; padding: 24px 16px;
    display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center;
  }
  /* Bit recharging, the same picture as the dashboard's boot splash (made by
     tools/brand/build.mjs), at the same size: 5 screen pixels per Bit pixel, 7
     on big windows. It stands still without motion, and while the page waits
     for a click rather than for Xenon. */
  .bit {
    grid-row: 2; width: 100px; aspect-ratio: 20 / 19;
    background: url("bit-recharge.svg") center / contain no-repeat;
    image-rendering: pixelated;
  }
  .wrap.is-asking .bit { background-image: url("bit-recharge-still.svg"); }
  @media (min-width: 900px) and (min-height: 600px) { .bit { width: 140px; } }
  @media (prefers-reduced-motion: reduce) { .bit { background-image: url("bit-recharge-still.svg"); } }
  .words {
    grid-row: 3; align-self: start; width: min(100%, 46ch);
    display: flex; flex-direction: column; gap: 8px; padding-top: 20px;
  }
  .status { font-size: 14px; color: #bdbdbd; text-align: center; min-height: 1.4em; margin: 0; }
  .hint { font-size: 13px; color: #bdbdbd; line-height: 1.5; margin: 0; }
  .status:empty, .hint:empty, .setup-note:empty { display: none; }
  /* The first-run offer, hidden until the probe gives up on finding Xenon (see
     the setup handover in the script below). Left-aligned: it is a paragraph
     to read, and centred lines make the eye hunt for each start. */
  .setup { display: none; flex-direction: column; align-items: flex-start; gap: 10px; }
  .setup.show { display: flex; }
  .setup-title { font-size: 17px; font-weight: 600; margin: 0; }
  .setup-body, .setup-note { font-size: 14px; color: #bdbdbd; line-height: 1.5; margin: 0; }
  .setup-note { font-size: 13px; }
  .setup-btn {
    font: inherit; font-size: 14px; font-weight: 600; color: #0b2412;
    background: #6ee787; border: 0; border-radius: 6px;
    min-height: 44px; padding: 0 20px; margin: 6px 0 2px; cursor: pointer;
  }
  .setup-btn:hover { background: #8bf0a0; }
  .setup-btn:focus-visible { outline: 2px solid #ededed; outline-offset: 2px; }
  .setup-btn:disabled { background: #2c2c2c; color: #a6a6a6; cursor: default; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="bit" aria-hidden="true"></div>
    <div class="words">
      <p class="status" id="status" role="status">Starting Xenon…</p>
      <p class="hint" id="hint"></p>
      <div class="setup" id="setup">
        <h1 class="setup-title" id="setup-title">Xenon isn't finished installing</h1>
        <p class="setup-body" id="setup-body">One part of Xenon is still missing on this PC. Setup installs it in a few minutes and shows each step in its own window. You only do this once.</p>
        <button class="setup-btn" id="setup-btn" type="button">Complete setup</button>
        <p class="setup-note" id="setup-note">Already installed? Wait a few seconds: the dashboard opens here by itself when Xenon starts.</p>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    // The local backend service. Kept in sync with server.js / @xenon/core.
    var port = window.__XENON_PORT__ || 3030;
    // `shell=main` marks the app's own window: in "widgets only" mode the server
    // sends it to the small driver page instead (server/js/usage-mode.js).
    var DASHBOARD = 'http://127.0.0.1:' + port + '/?shell=main';
    var PING = 'http://127.0.0.1:' + port + '/ping';

    var statusEl = document.getElementById('status');
    var hintEl = document.getElementById('hint');
    var setupEl = document.getElementById('setup');
    var setupTitleEl = document.getElementById('setup-title');
    var setupBodyEl = document.getElementById('setup-body');
    var setupBtn = document.getElementById('setup-btn');
    var setupNoteEl = document.getElementById('setup-note');
    var wrapEl = document.getElementById('wrap');
    var okStreak = 0;

    // Bit recharges while Xenon is on its way, and stands still while the page
    // waits for a click: an animation there would claim work that is not happening.
    function asking(on) { wrapEl.classList.toggle('is-asking', on); }
    var done = false;

    // Everything below is timed off the WALL CLOCK, never off a probe counter.
    // A refused fetch does not cost a fixed amount: on Windows each failed
    // attempt takes ~2s, four times the ~500ms retry delay this file used to
    // assume, so counting attempts made every threshold land four times later
    // than its own comment claimed — the setup offer at ~80s instead of ~20s,
    // and the re-arm below at ~3min instead of ~35s (measured, not guessed).
    var startedAt = Date.now();
    function elapsed() { return Date.now() - startedAt; }

    // First-run setup handover. The installer used to launch the dashboard-engine
    // bootstrap itself, silently, the instant it finished — an unsigned setup
    // spawning a hidden PowerShell downloader, which is what got the whole
    // install flagged as a trojan and quarantined. Now nothing runs unattended:
    // if no backend ever answers, WE offer the same install behind a button, and
    // the shell runs it in a console the user can watch (xenon-setup:run →
    // run_backend_bootstrap in lib.rs). The shell sets the flag below only on
    // release Windows builds that actually carry the bootstrap script — never
    // under `tauri dev`, where pressing it would install for real.
    var SETUP_AFTER_MS = 20000; // silence past the shell's own logon-task nudge
    var SETUP_REARM_MS = 30000; // after a click that still produced no backend
    var canSetup = window.__XENON_SETUP_AVAILABLE__ === true;
    var setupClickedAt = 0; // timestamp of the last click, 0 = never clicked

    // The shell sets this when it has ESTABLISHED that the backend was never
    // installed here: no "Xenon Edge Widget" logon task registered and nothing
    // listening (see spawn_backend_nudge in lib.rs). That is the state every
    // fresh setup.exe install is in, and the 20 s above is the wrong answer to
    // it — twenty seconds of a spinner that was never going to resolve, right
    // after an installer said it had finished. The wait still applies when
    // something might genuinely still be starting; this flag says nothing is.
    function backendAbsent() { return window.__XENON_BACKEND_ABSENT__ === true; }

    // The THIRD state, and the one that used to be invisible: the engine is
    // installed and its logon task is registered, but the task is switched OFF,
    // so nothing will ever start it. Windows offers that toggle in Task
    // Manager's "Startup apps" and cleanup tools flip it too. A `schtasks
    // /Query` succeeds on a disabled task, so the shell used to read this as
    // "installed" and the page ended on the install panel, whose button runs a
    // bootstrap that answers "already installed, nothing to do" — a dead end you
    // could sit in forever (reported on Discord, Aug 2026). The shell now reads
    // the task's XML and says so; the panel below offers the switch instead.
    var panelMode = ''; // '' | 'install' | 'enable' | 'start' | 'repair'
    function taskDisabled() { return window.__XENON_TASK_DISABLED__ === true; }

    // The FOURTH state, and the one that sent people round in circles: the
    // engine is installed and its task is on, but nothing answers (a slow cold
    // boot, or an engine that fails to start). This page used to fall through
    // to the install panel after 20 s; its setup found everything in place and
    // said "already installed, restart your PC", and the restart led straight
    // back here (reported on Discord, Oct 2026). The shell says when the task is
    // registered and on; from then on this page never talks about installing.
    // It waits longer, offers to start Xenon, and only when a start still
    // produces nothing offers the repair, which shows the reason and reinstalls
    // the engine with the user's data kept.
    var START_AFTER_MS = 25000; // a cold boot can keep the engine quiet this long
    var START_REARM_MS = 30000; // after "Start Xenon" with still no answer
    var startClickedAt = 0;
    function backendInstalled() { return window.__XENON_BACKEND_INSTALLED__ === true; }
    function startFailed() { return window.__XENON_START_FAILED__ === true; }

    function showPanel(mode, title, body, note, button) {
      panelMode = mode;
      setupTitleEl.textContent = title;
      setupBodyEl.textContent = body;
      setupNoteEl.textContent = note;
      setupBtn.textContent = button;
      setupBtn.disabled = false;
      setupEl.classList.add('show');
      hintEl.textContent = '';
      statusEl.textContent = '';
      asking(true);
    }

    function offerStart() {
      // Replaces an install panel nobody has acted on yet: that one was shown
      // before the shell's answer arrived, and it is the wrong one.
      if (done || (panelMode !== '' && !(panelMode === 'install' && !setupClickedAt))) return;
      showPanel('start', 'Xenon has not started yet',
        'Xenon is installed on this PC, but it is not running. Start it now.',
        'Just turned the PC on? Xenon can need up to a minute; the dashboard opens here by itself.',
        'Start Xenon');
    }

    function offerRepair() {
      if (done || panelMode !== 'start') return;
      if (!canSetup) {
        // A build without the bootstrap (tauri dev) has no repair to offer:
        // give the start back rather than leave a dead button.
        setupBtn.disabled = false;
        setupBtn.textContent = 'Try again';
        setupBodyEl.textContent = 'Xenon has still not started. The reason is in %LOCALAPPDATA%\\Xenon\\server.log.';
        asking(true);
        return;
      }
      showPanel('repair', 'Xenon did not start',
        'Xenon is installed, but it does not start. Repair shows why, starts it again and, if that is ' +
        'not enough, installs it again. Your settings, layouts and notes are kept.',
        '', 'Repair Xenon');
    }

    function offerEnable() {
      if (done || panelMode === 'enable') return;
      showPanel('enable', 'Xenon is set not to start',
        'Xenon is installed, but its start at sign-in is turned off, so it is not running. ' +
        'Turn it on and Xenon starts now, and every time you sign in.',
        '', 'Turn on');
    }

    // Windows can refuse the switch when the task was registered at the highest
    // run level: that needs an administrator, and nothing else here would say
    // so — the page would keep spinning at a task still switched off.
    var saidEnableFailed = false;
    function enableFailed() {
      if (saidEnableFailed || done) return;
      saidEnableFailed = true;
      setupBtn.disabled = false;
      setupBtn.textContent = 'Try again';
      setupBodyEl.textContent =
        'Windows needs an administrator to turn it on. You can do it yourself: press ' +
        'Ctrl+Shift+Esc, open Startup apps, find Xenon and set it to Enabled.';
      asking(true);
    }

    function offerSetup() {
      if (!canSetup || done || setupEl.classList.contains('show')) return;
      panelMode = 'install';
      setupEl.classList.add('show');
      hintEl.textContent = ''; // the panel is the call to action now
      // "Waiting for the Xenon service…" over a panel that says the service is
      // not installed is the page arguing with itself. The panel owns the
      // message from here; the probe keeps running underneath and still takes
      // over on its own if the backend turns up.
      statusEl.textContent = '';
      asking(true);
    }

    /** True once the panel owns the copy — the timed messages stand down. */
    function setupShowing() { return setupEl.classList.contains('show'); }

    setupBtn.addEventListener('click', function () {
      setupClickedAt = Date.now();
      setupBtn.disabled = true;
      setupNoteEl.textContent = '';
      asking(false);
      if (panelMode === 'enable') {
        saidEnableFailed = false; // a retry gets to report its own failure
        setupBtn.textContent = 'Turning on…';
        setupBodyEl.textContent = 'Starting Xenon. The dashboard opens here when it is ready.';
        // Not a navigation: the shell intercepts this scheme and never loads it.
        window.location.href = 'xenon-setup:enable-task';
        return;
      }
      if (panelMode === 'start') {
        startClickedAt = Date.now();
        window.__XENON_START_FAILED__ = false; // a retry reports its own outcome
        setupBtn.textContent = 'Starting…';
        setupBodyEl.textContent = 'Starting Xenon. The dashboard opens here when it is ready.';
        setupNoteEl.textContent = '';
        window.location.href = 'xenon-setup:start';
        return;
      }
      if (panelMode === 'repair') {
        setupBtn.textContent = 'Repair is running';
        setupBodyEl.textContent =
          'Follow the steps in the window that just opened. The dashboard opens here by itself ' +
          'as soon as Xenon starts.';
        window.location.href = 'xenon-setup:run';
        return;
      }
      setupBtn.textContent = 'Setup is running';
      setupBodyEl.textContent =
        'Follow the steps in the window that just opened. When setup ends, the dashboard ' +
        'opens here by itself.';
      // Not a navigation: the shell intercepts this scheme and never loads it.
      window.location.href = 'xenon-setup:run';
    });

    // Nothing tells this page whether the console ever opened: the shell may
    // have failed to spawn it, or the script may have exited in seconds because
    // it found the engine already registered. Either way a permanently dead
    // button would be the end of the road, so give it back after a while — the
    // shell allows a fresh run once its console is gone (see BOOTSTRAP_CHILD).
    function rearmSetup() {
      if (setupBtn.disabled === false) return;
      // A start that produced nothing moves on to the repair (offerRepair).
      if (panelMode === 'start') return;
      if (panelMode === 'enable') {
        // The switch went in and still nothing answers: the task is on now, so
        // what is left is starting it, and a restart is the reliable way there.
        setupBtn.disabled = false;
        setupBtn.textContent = 'Try again';
        setupBodyEl.textContent =
          'Xenon will now start when you sign in, but it has not started yet. Restart the PC ' +
          'and it opens here.';
        asking(true);
        return;
      }
      if (panelMode === 'repair') {
        setupBtn.disabled = false;
        setupBtn.textContent = 'Run repair again';
        setupBodyEl.textContent =
          'Xenon has still not started. If the repair window said what is wrong, fix that and run ' +
          'repair again.';
        setupNoteEl.textContent =
          'To ask for help, send the files server.log and setup.log from %LOCALAPPDATA%\\Xenon.';
        asking(true);
        return;
      }
      setupBtn.disabled = false;
      setupBtn.textContent = 'Run setup again';
      setupBodyEl.textContent =
        'Xenon has still not started. If the setup window did not open, or it said Xenon is ' +
        'already installed, restart the PC. Otherwise run setup again.';
      setupNoteEl.textContent =
        'To ask for help, send the file %LOCALAPPDATA%\\Xenon\\setup.log: setup writes down ' +
        'everything it did there.';
      asking(true);
    }

    function go() {
      if (done) return;
      done = true;
      statusEl.textContent = 'Opening the dashboard…';
      // Replace so the splash is not in the webview history.
      window.location.replace(DASHBOARD);
    }

    // One-shot latches for the messages below, so a time-based threshold that
    // stays true on every later probe still only fires once.
    var saidWaiting = false, saidSlow = false, saidStuck = false;

    function probe() {
      if (done) return;
      // A no-cors fetch resolves the moment the server answers (any status),
      // and rejects while it is still refusing connections. Require TWO
      // consecutive answers before navigating: during an install/restart a
      // dying instance can answer one last ping and then take the port down,
      // which would strand the webview on a dead dashboard with no retry.
      fetch(PING, { mode: 'no-cors', cache: 'no-store' })
        .then(function () {
          okStreak++;
          if (okStreak >= 2) return go();
          setTimeout(probe, 600);
        })
        .catch(function () {
          okStreak = 0;
          // The setup offer can now arrive before any of these (the shell knows
          // within a couple of seconds when nothing is installed), so each one
          // stands down while the panel is up rather than overwriting it.
          if (!saidWaiting && elapsed() >= 3000 && !setupShowing()) {
            saidWaiting = true;
            statusEl.textContent = 'Waiting for Xenon to start…';
          }
          if (!saidSlow && elapsed() >= 10000 && !setupShowing()) {
            saidSlow = true;
            hintEl.textContent = 'This is taking longer than usual. Xenon is still trying.';
          }
          // The shell knows within a couple of seconds when the task is merely
          // switched off, and that panel is the right one whether or not this
          // build could install anything.
          if (taskDisabled()) offerEnable();
          if (window.__XENON_TASK_ENABLE_FAILED__ === true) enableFailed();
          // 20s with no answer, and this build can install the engine itself:
          // offer it. The shell's logon-task nudge (see lib.rs) has had its shot
          // by now, so silence this long means "not installed", not "slow".
          // offerSetup() is idempotent, so re-entering here costs nothing.
          // Installed and switched on: never the install panel (see offerStart).
          if (backendInstalled()) {
            if (elapsed() >= START_AFTER_MS) offerStart();
            if (startClickedAt && (startFailed() || Date.now() - startClickedAt >= START_REARM_MS)) {
              offerRepair();
            }
          } else if (canSetup && (backendAbsent() || elapsed() >= SETUP_AFTER_MS)) {
            offerSetup();
          }
          // Setup was started and the backend still isn't there — hand the
          // button back rather than leave a dead one on screen.
          if (setupClickedAt && Date.now() - setupClickedAt >= SETUP_REARM_MS) {
            rearmSetup();
          }
          // A minute with no answer: the widget backend is probably not
          // installed or not running at all — the app is only a display for it.
          // The shell has already tried to start its logon task by now (see
          // lib.rs), so at this point the user needs to act. Keep retrying
          // regardless: if they install or start it, this page hands over on its
          // own. This must fire whether or not the build can offer setup: an
          // engine that is installed but failing to start reaches here with a
          // button that can't help.
          if (!saidStuck && elapsed() >= 60000 && !setupShowing()) {
            saidStuck = true;
            // One page serves all three platform builds, and each ships a
            // different installer — telling a Mac or Linux user to run
            // INSTALL.bat sends them looking for a file that does not exist.
            var installer = /Mac/i.test(navigator.platform || '') ? 'INSTALL.command'
              : /Win/i.test(navigator.platform || '') ? 'INSTALL.bat'
              : 'INSTALL.sh';
            hintEl.textContent = 'Xenon has not started after a minute. Restart the PC, or install it again with ' +
              installer + ' from github.com/marcimastro98/Xenon. The dashboard opens here as soon as Xenon starts.';
          }
          setTimeout(probe, 500);
        });
    }

    probe();
  </script>
</body>
</html>
