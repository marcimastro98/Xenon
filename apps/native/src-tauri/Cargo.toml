[package]
name = "xenon-native"
version = "4.11.13"
description = "Xenon native kiosk shell for any second screen"
authors = ["Marcello Mastroeni (marcimastro98)"]
edition = "2021"
rust-version = "1.77"

# The library the desktop and (future) mobile entry points call into.
[lib]
name = "xenon_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# `macos-private-api` is required by `macOSPrivateApi` in tauri.conf.json, and
# tauri-build checks the two agree rather than deriving one from the other. It is
# on for exactly one thing: the window background colour. WKWebView paints its own
# opaque WHITE under the page, and the switch that turns that off is a private key
# wry only compiles in under this feature. It affects macOS builds alone, and
# Xenon does not ship through the App Store, where private APIs are refused.
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows only, and pinned to the exact versions wry already resolves, for the
# same reason as webkit2gtk below: `with_webview` hands over wry's own WebView2
# types. Used by `memory_level` to let a hidden webview give memory back.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"

# macOS only, the versions tao and wry already resolve (no new crate): the
# widget layers set their window level, Spaces behaviour and mouse pass-through
# (layers/macos.rs), which Tauri has no call for.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSEvent", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }

# Linux only, and pinned to the exact version wry already resolves so the
# WebView type in `with_webview` is the SAME type this crate names — a second
# copy of webkit2gtk would compile and then refuse to match. Used by
# `webview_guard` to hear the render process die.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
# Same versions already in the lockfile via webkit2gtk's transitive graph; pinned
# with `=` so Cargo keeps the single copy rather than resolving a second one.
gdk = "=0.18.2"
gtk = "=0.18.2"

[features]
# Keep default empty; custom Cargo features can be added later without touching
# tauri's own feature set.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Unwind, not abort. `panic = "abort"` turns a panic anywhere — including the
# display watchdog and the cursor/focus guards, three threads that poll the OS
# forever — into an immediate process death, with no window, no message and (in
# a `windows_subsystem = "windows"` build) nowhere to print anything: the app
# simply vanishes mid-session. Unwinding costs a little binary size and keeps the
# kiosk alive when a background poll fails; `crash_log::spawn_supervised` catches
# the panic, writes it down and restarts the thread.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
